<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Omsynsfangaren</title>
<style>html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:none}
#c{display:block;width:100vw;height:100vh}#hud{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:18px;pointer-events:none;text-shadow:0 1px 3px #000}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.88);text-align:center;padding:24px}
#msg h1{font-size:28px;margin:0 0 8px}#msg p{max-width:34ch;line-height:1.45;margin:6px 0}#msg button{margin-top:16px;font-size:20px;padding:12px 28px;border:0;border-radius:12px;background:#22c55e;color:#052e16;font-weight:700}</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div id="msg"><h1>Omsynsfangaren</h1><p>Du er saksbehandlar. Fang dei <b style="color:#4ade80">relevante omsyna</b> og unngå dei <b style="color:#f87171">utanforliggjande</b>.</p><p>Dra fingeren sidelengs for å styre. Tre utanforliggjande omsyn = vedtaket er ugyldig (fvl. § 40).</p><button id="go">Start</button><p id="best" style="opacity:.7;font-size:14px"></p></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),go=document.getElementById('go'),bestEl=document.getElementById('best');
let W,H,dpr;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const GOOD=['sakleg samanheng','likebehandling','partens argument','lova sitt føremål','forholdsmessigheit','presedens','barnets beste','rettstryggleik','dokumentasjon','§ 57 (1) c'];
const BAD=['partens utsjånad','personleg uvilje','valkamp','tidspress','kven som spurde','magekjensle','sladder','avisoppslag','vennskap','trøyttleik'];
let items=[],px,score,bad,speed,t0,alive,best=+(localStorage.getItem('omsyn-best')||0);bestEl.textContent=best?('Beste: '+best):'';
function reset(){items=[];px=W/2;score=0;bad=0;speed=1;alive=true;t0=performance.now();spawnTimer=0}
let spawnTimer=0,last=0;
function spawn(){const good=Math.random()<0.62;items.push({x:40+Math.random()*(W-80),y:-30,good,txt:(good?GOOD:BAD)[Math.floor(Math.random()*10)],vy:(1.6+Math.random()*1.2)*speed})}
function step(ts){const dt=Math.min(40,ts-last||16);last=ts;if(alive){spawnTimer+=dt;speed=1+(ts-t0)/45000;if(spawnTimer>Math.max(380,900/speed)){spawn();spawnTimer=0}
const by=H-70;for(const it of items){it.y+=it.vy*dt/16;if(it.y>by-18&&it.y<by+30&&Math.abs(it.x-px)<70){it.hit=true;if(it.good)score++;else{bad++;navigator.vibrate&&navigator.vibrate(80)}}}
items=items.filter(it=>!it.hit&&it.y<H+40);if(bad>=3){alive=false;best=Math.max(best,score);localStorage.setItem('omsyn-best',best);msg.querySelector('h1').textContent='Vedtaket er ugyldig';msg.querySelector('p').innerHTML='Du vekta tre utanforliggjande omsyn. Poeng: <b>'+score+'</b>. Beste: '+best+'.';go.textContent='Nytt vedtak';msg.style.display='flex'}}
ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);ctx.font='15px -apple-system,Helvetica,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
for(const it of items){ctx.fillStyle=it.good?'#4ade80':'#f87171';ctx.beginPath();ctx.roundRect(it.x-66,it.y-16,132,32,10);ctx.fill();ctx.fillStyle='#052e16';if(!it.good)ctx.fillStyle='#450a0a';ctx.fillText(it.txt,it.x,it.y)}
ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.roundRect(px-70,H-70,140,22,8);ctx.fill();ctx.fillStyle='#0c4a6e';ctx.fillText('vedtak',px,H-59);
hud.textContent='Poeng '+score+'   ·   Utanforliggjande '+bad+'/3';requestAnimationFrame(step)}
function move(e){const x=(e.touches?e.touches[0].clientX:e.clientX);px=Math.max(70,Math.min(W-70,x))}
addEventListener('touchstart',move,{passive:true});addEventListener('touchmove',move,{passive:true});addEventListener('mousemove',move);
go.onclick=()=>{msg.style.display='none';reset()};requestAnimationFrame(step);
</script></body></html>
